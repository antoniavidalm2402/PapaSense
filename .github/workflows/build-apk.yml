name: Compilar APK PapaSense Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v5

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sincronizar archivos web en Android Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html app.js styles.css manifest.json android/app/src/main/assets/
          if [ -d "icons" ]; then cp -r icons android/app/src/main/assets/; fi

      - name: Instalar Gradle Wrapper
        working-directory: ./android
        run: gradle wrapper

      - name: Compilar APK Debug
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v5
        with:
          name: PapaSense-T6-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
